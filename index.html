<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 20%, #1b2434 0%, #0d1220 55%, #05070c 100%);
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 14px;
      padding: 20px;
    }
    h1 {
      letter-spacing: 8px;
      font-size: 32px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }
    p.instructions {
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      text-align: center;
      max-width: 600px;
    }
    p.instructions strong {
      color: #fff;
    }
    canvas {
      display: block;
      background: #000;
      border: 1px solid #333;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <h1>ASTEROIDS</h1>
  <p class="instructions">
    Destruye los asteroides antes de que choquen contra tu nave. Usa
    <strong>&larr;</strong> <strong>&rarr;</strong> para rotar, <strong>&uarr;</strong> para propulsar
    y <strong>Espacio</strong> para disparar. Los asteroides grandes se dividen en más pequeños al destruirlos.
  </p>
  <canvas id="canvas" width="800" height="600"></canvas>
  <script src="game.js"></script>
</body>
</html>
